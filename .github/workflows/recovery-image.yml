name: Recovery image from previously published bundle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hibiscus-recovery-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test scripts
        run: |
          node --test
          sh test/entrypoint.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.recovery
          load: true
          tags: iari/hibiscus-server:2.10.17-java21-recovery
      - name: Verify runtime and bundle
        run: |
          docker run --rm --entrypoint java iari/hibiscus-server:2.10.17-java21-recovery -version
          docker run --rm --entrypoint sh iari/hibiscus-server:2.10.17-java21-recovery -c 'test -f jameica-linux.jar && grep -q "version=\"2.10.17\"" plugins/hibiscus/plugin.xml'
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish recovery tag only
        run: docker push iari/hibiscus-server:2.10.17-java21-recovery
