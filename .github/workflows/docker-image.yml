name: Docker Image CI
on:
  push:
    branches: [main]
    paths: [Dockerfile, docker-entrypoint.sh, release-version, 'test/**', '.github/workflows/docker-image.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: hibiscus-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test release parser and entrypoint
        run: |
          node --test
          sh test/entrypoint.sh
      - name: Read version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(cat release-version)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: HIBISCUS_VERSION=${{ steps.version.outputs.value }}
          tags: |
            iari/hibiscus-server:${{ steps.version.outputs.value }}
            iari/hibiscus-server:${{ steps.version.outputs.value }}-java21
            iari/hibiscus-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
